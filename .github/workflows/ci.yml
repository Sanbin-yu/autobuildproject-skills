name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / python-${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11"]

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 设置 Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: 安装测试依赖
        run: python -m pip install -U pip pytest

      - name: 运行 Python 测试
        env:
          PYTHONUTF8: "1"
        run: python -m pytest

      - name: 生成并打包示例项目
        shell: bash
        env:
          CI_SMOKE_OUTPUT_DIR: ${{ runner.temp }}
        run: ./scripts/ci-smoke.sh all
