[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "springboot-project-generator"
version = "0.3.0"
description = "Generate Maven multi-module Spring Boot backend projects from CLI arguments or project.yaml."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
    { name = "Sanbin Yu" }
]
keywords = ["codex", "skill", "spring-boot", "maven", "backend", "generator"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Code Generators",
]

[project.scripts]
springboot-project-generator = "springboot_project_generator.cli:main"

[tool.setuptools.packages.find]
include = ["springboot_project_generator*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
